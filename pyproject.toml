[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "holocron"
version = "0.1.0"
description = "Chatbot de perguntas e respostas sobre os seis primeiros filmes de Star Wars, com RAG, cache em dois níveis, roteamento de modelos e tool calling."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=0.5",
    "datasets>=5.0",
    "langchain-text-splitters>=0.2",
    "numpy>=1.26",
    "openai>=1.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.2.0",
    "pandas>=2.0",
    "pydantic>=2.0",
    "pypdf>=4.0",
    "python-dotenv>=1.0",
    "ragas>=0.3.1",
    "streamlit>=1.30",
]

[project.optional-dependencies]
dev = [
    "nbval>=0.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Placeholders intencionais para o aluno preencher (TODOs do projeto)
"src/pipeline/*.py" = ["F821", "F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]